<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>claudedita — seu acesso</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<link rel="stylesheet" href="/styles.css" />
  <style>
  .ok-ic { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 14px; display: grid; place-items: center; background: rgba(58,214,138,.14); color: var(--green); font-size: 30px; animation: pop .5s var(--ease) both; }
  .ok-ic.wait { background: var(--accd); color: var(--acc); }
  .ok-ic.bad { background: rgba(255,107,107,.14); color: var(--red); }
  .page h1 { text-align: center; font-size: clamp(28px, 7vw, 40px); letter-spacing: -.03em; line-height: 1.1; margin: 0 0 10px; }
  .page .sub { margin-bottom: 22px; }
  .dl { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 10px 0; text-decoration: none; font-weight: 700; font-size: 15px; transition: border-color .2s, transform .2s; animation: pop .45s var(--ease) both; }
  .dl:hover { border-color: rgba(255,196,26,.5); transform: translateY(-2px); }
  .dl span { flex: 1; } .dl b { font-size: 12px; background: var(--acc); color: #17120a; padding: 6px 11px; border-radius: 99px; }
  .dl.off { opacity: .5; pointer-events: none; }
  .next { margin-top: 22px; } .next ol { margin: 0; padding-left: 20px; color: var(--mut); line-height: 1.7; } .next b { color: var(--txt); }
  .ref { text-align: center; color: var(--mut2); font-size: 12px; margin-top: 14px; }
  .prog { max-width: 320px; margin: 0 auto; }
  .page .btn { display: flex; margin-top: 16px; }
</style>
<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',

</script>

</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <header class="topbar show"><a class="logo" href="/"><img src="/assets/logo.png" alt="" width="28" height="28"><span>claudedita</span></a></header>
  <main class="page" id="stage"></main>
  <footer class="footer" style="padding-bottom:40px"><nav><a href="/privacidade">Política de Privacidade</a><a href="/termos">Termos de Uso</a></nav></footer>
  <script>
    // (opcional) mesmo ID do Meta Pixel usado no app.js
    const PIXEL_ID = "1441261254273109";
    // (opcional) WhatsApp de suporte com DDI, só números. Ex: 5584999999999
    const SUPPORT_WHATSAPP = "";

    const q = new URLSearchParams(location.search);
    const pid = (q.get("payment_id") || q.get("collection_id") || "").replace(/\D/g, "");
    const ref = (q.get("ref") || q.get("external_reference") || "").replace(/[^\w-]/g, "");
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const $st = document.getElementById("stage");
    const sup = SUPPORT_WHATSAPP ? `<a class="btn ghost block" href="https://wa.me/${SUPPORT_WHATSAPP}?text=${encodeURIComponent("Oi! Preciso de ajuda com o pedido " + ref + " (claudedita).")}">Falar com o suporte</a>` : "";

    function approved(d) {
            const links = (d.acessos || []).map((a) => {
        const ok = /^https?:\/\//.test(a.url);
        return `<a class="dl ${ok ? "" : "off"}" href="${ok ? esc(a.url) : "#"}" target="_blank" rel="noopener"><span>${esc(a.label)}</span><b>${ok ? "ABRIR" : "EM BREVE"}</b></a>`;
      }).join("");
      $st.innerHTML = `
        <div class="ok-ic">✓</div>
        <h1>${d.nome ? esc(d.nome.split(" ")[0]) + ", pagamento" : "Pagamento"} aprovado!</h1>
        <p class="sub">Seus acessos estão aqui embaixo e também foram para <b>${esc(d.email || "o seu e-mail")}</b>.</p>
        ${links}
        ${d.guia ? `<a class="btn block" href="${esc(d.guia)}" target="_blank" rel="noopener">Como instalar a skill no Claude</a>` : ""}
        <div class="card next"><h4>Próximos passos</h4><ol><li>Baixe o <b>pixel-reel-editor.zip</b> e guarde num lugar fácil.</li><li>No Claude, abra as <b>Configurações</b>, vá na área de <b>Skills</b> e envie o .zip.</li><li>Numa conversa nova, peça: <b>"faz um vídeo nesse estilo sobre [seu tema]"</b>.</li></ol></div>
        ${d.ref ? `<div class="ref">pedido ${esc(d.ref)}</div>` : ""}${sup}`;
      try { const s = JSON.parse(localStorage.getItem("ce_state")) || {}; s.bumps = []; localStorage.setItem("ce_state", JSON.stringify(s)); } catch {}
      if (PIXEL_ID && window.fbq && !sessionStorage.getItem("ce_px_" + pid)) {
        let v = 0; try { v = Number(sessionStorage.getItem("ce_total")) || 0; } catch {}
        fbq("track", "Purchase", { value: v, currency: "BRL" }); sessionStorage.setItem("ce_px_" + pid, "1");
      }
    }
    function waiting(msg) {
      $st.innerHTML = `
        <div class="ok-ic wait">⏳</div>
        <h1>Quase lá!</h1>
        <p class="sub">${msg}</p>
        <div class="prog"><i id="pg" style="width:10%"></i></div>
        ${ref ? `<div class="ref">pedido ${esc(ref)}</div>` : ""}${sup}`;
    }
    function failed() {
      $st.innerHTML = `
        <div class="ok-ic bad">!</div>
        <h1>O pagamento não passou</h1>
        <p class="sub">Tenta de novo, de preferência no <b>Pix</b>, que aprova na hora e aparece na própria página.</p>
        <a class="btn lg block" href="/?pagamento=falhou">Tentar de novo</a>${sup}`;
    }

    async function check(tries = 0) {
      if (!pid) return waiting("Recebemos seu pedido. Assim que o pagamento for confirmado, o acesso chega no seu <b>e-mail</b>. Se pagou no Pix, pode levar alguns minutos.");
      try {
        const r = await fetch("/api/acesso?payment_id=" + pid); const d = await r.json();
        if (d.status === "approved") return approved(d);
        if (["rejected", "cancelled", "refunded", "charged_back"].includes(d.status)) return failed();
        if (tries === 0) waiting("Seu pedido foi criado. Se escolheu <b>Pix</b>, é só pagar o código: esta tela libera o acesso <b>sozinha</b> quando o pagamento cair.");
        const pg = document.getElementById("pg"); if (pg) pg.style.width = Math.min(95, 10 + tries * 2.5) + "%";
        if (tries < 36) setTimeout(() => check(tries + 1), 5000); // confere por até 3 minutos
        else waiting("Ainda não recebemos a confirmação. Sem problema: quando o pagamento cair, o acesso chega no seu <b>e-mail</b> automaticamente.");
      } catch { if (tries < 36) setTimeout(() => check(tries + 1), 5000); }
    }
    check();
  </script>
</body>
</html>
