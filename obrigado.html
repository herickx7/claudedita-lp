<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>claudedita — pedido recebido</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <header class="hud"><div class="brand">claudedita</div><div class="xp"><span class="xp-lvl">LV MAX</span><div class="xp-bar"><div class="xp-fill" style="width:100%"></div></div></div></header>
  <main class="stage" id="stage"></main>
  <script>
    // (opcional) mesmo ID do Meta Pixel usado no app.js
    const PIXEL_ID = "";
    // (opcional) WhatsApp de suporte com DDI, só números. Ex: 5584999999999
    const SUPPORT_WHATSAPP = "";

    const q = new URLSearchParams(location.search);
    const ok = q.get("status") === "aprovado";
    const ref = (q.get("ref") || q.get("external_reference") || "").replace(/[^\w-]/g, "");
    let lead = {}; try { lead = (JSON.parse(localStorage.getItem("ce_state")) || {}).lead || {}; } catch {}
    const first = (lead.name || "").split(" ")[0];
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const sup = SUPPORT_WHATSAPP ? `<a class="btn" style="margin-top:14px" href="https://wa.me/${SUPPORT_WHATSAPP}?text=${encodeURIComponent("Oi! Fiz o pedido " + ref + " no claudedita.")}">FALAR NO WHATSAPP</a>` : "";
    document.getElementById("stage").innerHTML = ok ? `
      <section class="screen">
        <h1 class="cap1">${first ? esc(first) + ", " : ""}você</h1><div class="cap2">ZEROU O JOGO!</div>
        <div class="coach"><img src="/assets/avatar-thumb.png" alt="" width="96"><div class="bubble">Pagamento <b>aprovado</b>! 🎉 Seu acesso está indo pro seu <b>WhatsApp</b> e e-mail agora.</div></div>
        <div class="panel"><div class="panel-top"><i></i><i></i><i></i>proximos_passos.txt</div><div class="panel-body" style="line-height:1.6">
          1. Abre o WhatsApp e salva nosso contato.<br>2. Confere também seu e-mail (e a caixa de spam).<br>3. Começa pelo módulo 1 hoje mesmo.
          ${ref ? `<div class="sub" style="text-align:left">pedido: ${esc(ref)}</div>` : ""}
        </div></div>${sup}
      </section>` : `
      <section class="screen">
        <h1 class="cap1">Quase lá!</h1><div class="cap2">FALTA PAGAR</div>
        <div class="coach"><img src="/assets/avatar-point.png" alt="" width="96"><div class="bubble">Seu pedido foi criado, mas o pagamento ainda está <b>pendente</b>. Se escolheu Pix, é só pagar o código. Assim que cair, o acesso vai pro seu <b>WhatsApp</b>.</div></div>
        ${ref ? `<div class="sub">pedido: ${esc(ref)}</div>` : ""}${sup}
        <a class="btn" href="/" style="margin-top:14px">VOLTAR PRA OFERTA</a>
      </section>`;
    if (ok) {
      try { const s = JSON.parse(localStorage.getItem("ce_state")) || {}; s.step = 0; s.bumps = []; localStorage.setItem("ce_state", JSON.stringify(s)); } catch {}
      if (PIXEL_ID) {
        !function (f, b, e, v, n, t, s) { if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); }; if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = "2.0"; n.queue = []; t = b.createElement(e); t.async = !0; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s); }(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
        fbq("init", PIXEL_ID);
        let v = 0; try { v = Number(sessionStorage.getItem("ce_total")) || 0; } catch {}
        fbq("track", "Purchase", { value: v, currency: "BRL" });
      }
    }
  </script>
</body>
</html>
